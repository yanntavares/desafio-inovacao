services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-handoff}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-handoff}
      POSTGRES_DB: ${POSTGRES_DB:-handoff}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-handoff}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    env_file: .env
    command: python -m app.worker
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
